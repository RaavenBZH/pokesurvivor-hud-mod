# Pousser un tag vX.Y.Z fabrique le zip et crée la release GitHub.
#   git tag v0.4.0 && git push origin v0.4.0
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # build.js vérifie le manifeste (world MAIN, document_start), lance les
      # tests, produit le zip, puis revérifie le zip. Il refuse de publier un
      # paquet dont un test échoue.
      - run: node tools/build.js
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
